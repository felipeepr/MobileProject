<ion-header [translucent]="true" class="header">
  <ion-toolbar>
    <ion-title>LIST COINS</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
<div class="BTC">
  <p>LIST A COIN</p>
  <form [formGroup]="listCoinForm" (ngSubmit)="saveInfo(listCoinForm.get('title').value)">
    <ion-input formControlName="image" placeholder="IMAGE" value="{{image}}"></ion-input>
    <ion-input formControlName="id" placeholder="ID" value="{{id}}"></ion-input>
    <ion-input formControlName="title" placeholder="title" value="{{title}}"></ion-input>
    <ion-input formControlName="price" placeholder="PRICE" value="{{price}}"></ion-input>
    <ion-input formControlName="description" placeholder="DESCRIPTION" value="{{description}}"></ion-input>
    <ion-input formControlName="category" placeholder="category" value="{{category}}"></ion-input>
    <ion-button type="submit" *ngIf="listCoinForm.valid">SAVE</ion-button>
    <ion-button type="submit" [disabled]="true" *ngIf="listCoinForm.invalid">INVALID FORM</ion-button>
    <ion-button (click)="goToCryptoShop()">GO TO CRYPTO SHOP</ion-button>
    <br>
    <label class="labels" *ngIf="listCoinForm.get('id')?.touched && listCoinForm.get('id')?.invalid">⚠️INVALID ID, PLEASE TYPE NUMBERS<br></label>
    <label class="labels" *ngIf="listCoinForm.get('title')?.touched && listCoinForm.get('title')?.invalid">⚠️INVALID title, PLEASE CHECK<br></label>
    <label class="labels" *ngIf="listCoinForm.get('price')?.touched && listCoinForm.get('price')?.invalid">⚠️Price invalid, please check<br></label>
    <label class="labels" *ngIf="listCoinForm.get('description')?.touched && listCoinForm.get('description')?.invalid">⚠️NULL DESCRIPTION, TYPE SOMETHING<br></label>
    <label class="labels" *ngIf="listCoinForm.get('category')?.touched && listCoinForm.get('category')?.invalid">⚠️category invalid, please check<br></label>
    <label class="labels" *ngIf="listCoinForm.get('image')?.touched && listCoinForm.get('image')?.invalid">⚠️INVALID IMAGE, PLEASE TYPE NUMBERS<br></label>
  </form>
</div>
</ion-content>
