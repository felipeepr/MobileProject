<ion-header [translucent]="true">
  <ion-toolbar >
    <ion-title class="title">CRYPTO SHOP</ion-title>
    <ion-button (click)="goCart()" class="cart">Cart</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="BTC" *ngFor="let coin of coinGot">
    <ion-img src="{{coin.img}}" class="img"></ion-img>
    <ion-input labelPlacement="floating" value="{{coin.id}}">
      <div slot="label">ID:<!--<ion-text color="danger">(Required):</ion-text> --></div>
    </ion-input>
    <ion-input labelPlacement="floating" value="{{coin.name}}">
      <div slot="label">NAME: </div>
    </ion-input>
    <ion-input labelPlacement="floating" value="{{coin.price}}">
      <div slot="label">PRICE ($): </div>
    </ion-input>
    <ion-button class="actionButtons" (click)="buy(coin.name)">BUY</ion-button>
    <ion-button class="actionButtons" (click)="sell(coin.name, coin.id)">SOLD</ion-button>
    <ion-button class="actionButtons" (click)="deleteCoin(coin)">REMOVE COIN</ion-button>
    <ion-button class="actionButtons" (click)="addToCart(coin)">ADD TO CART</ion-button>
  </div>
  <div class="BTC" *ngFor="let coins of coinsList2">
    <ion-img src="{{coins.img}}" class="img"></ion-img>
    <ion-input labelPlacement="floating" value="{{coins.id}}">
      <div slot="label">ID:<!--<ion-text color="danger">(Required):</ion-text> --></div>
    </ion-input>
    <ion-input labelPlacement="floating" value="{{coins.name}}">
      <div slot="label">NAME: </div>
    </ion-input>
    <ion-input labelPlacement="floating" value="{{coins.price}}">
      <div slot="label">PRICE ($): </div>
    </ion-input>
    <ion-button class="actionButtons" (click)="buy(coins.name)">BUY</ion-button>
    <ion-button class="actionButtons" (click)="sell(coins.name, coins.id)">SOLD</ion-button>
    <ion-button class="actionButtons" (click)="deletePreCreated(coins)">REMOVE COIN</ion-button>
    <ion-button class="actionButtons" (click)="addToCart(coins)">ADD TO CART</ion-button>
  </div>
</ion-content>
