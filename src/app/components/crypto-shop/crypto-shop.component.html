<ion-header [translucent]="true">
  <ion-toolbar>
  <div class="header">
    <ion-title class="title">CRYPTO SHOP</ion-title>
    <ion-button (click)="goCart()" class="cart"><ion-icon title="cart-outline" color:dark src="../../../assets/icon/cart-outline.svg"></ion-icon></ion-button>
  </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    <div class="BTC" *ngFor="let coin of coinGot.reverse()">
      <ion-img src="{{coin.image}}" class="img"></ion-img>
      <ion-input labelPlacement="floating" value="{{coin.id}}">
        <div slot="label">ID:<!--<ion-text color="danger">(Required):</ion-text> --></div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coin.title}}">
        <div slot="label">TITLE: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coin.price}}">
        <div slot="label">PRICE ($): </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coin.description}}">
        <div slot="label">DESCRIPTION: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coin.category}}">
        <div slot="label">CATEGORY: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coin.rating.rate}}">
        <div slot="label">RATE: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coin.rating.count}}">
        <div slot="label">COUNT: </div>
      </ion-input>
      <ion-button class="buyButton" (click)="buy(coin.title)">BUY</ion-button>
      <ion-button class="sellButton" (click)="sell(coin.title, coin.id)">SOLD</ion-button>
      <ion-button class="deleteButton" (click)="deleteCoin(coin)">REMOVE COIN</ion-button>
      <ion-button class="cartButton" (click)="addToCart(coin.title, coin)">ADD TO CART</ion-button>
    </div>
    <div class="BTC" *ngFor="let coins of coinsList2">
      <ion-img src="{{coins.image}}" class="img"></ion-img>
      <ion-input labelPlacement="floating" value="{{coins.id}}">
        <div slot="label">ID:<!--<ion-text color="danger">(Required):</ion-text> --></div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coins.title}}">
        <div slot="label">TITLE: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coins.price}}">
        <div slot="label">PRICE ($): </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coins.description}}">
        <div slot="label">DESCRIPTION: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coins.category}}">
        <div slot="label">CATEGORY: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coins.rating.rate}}">
        <div slot="label">RATE: </div>
      </ion-input>
      <ion-input labelPlacement="floating" value="{{coins.rating.count}}">
        <div slot="label">COUNT: </div>
      </ion-input>
      <ion-button class="buyButton" (click)="buy(coins.title)">BUY</ion-button>
      <ion-button class="sellButton" (click)="sellPrecreated(coins.title, coins)">SOLD</ion-button>
      <ion-button class="deleteButton" (click)="deletePreCreated(coins)">REMOVE COIN</ion-button>
      <ion-button class="cartButton" (click)="addToCart(coins.title, coins)">ADD TO CART</ion-button>
    </div>
  </div>
</ion-content>
